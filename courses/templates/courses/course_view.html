{% extends 'base.html' %}

{% block body %}
 <a href="{% url 'list_course' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i>
        List Course
      </a>
  <div class="container mt-4">
   
    <div class="card shadow border-0">
         
      <div class="card-header">
        <h4>View Course</h4>
      </div>

      <div class="card-body">
        
        <form>
            <fieldset disabled>
         
          <div class="mb-3">
            <label class="form-label">Thumbnail</label>

            {% if form.instance.thumbnail %}
              <img src="{{ form.instance.thumbnail.url }}" class="rounded-circle mb-3" width="120" height="120" style="object-fit: cover;" />
            {% endif %}

          </div>

          <div class="mb-3 plaintext">
            <label class="form-label">Course Name</label>
            {{ form.title }}
          </div>
          <div class="mb-3">
            <label class="form-label">Short Description</label>
            {{ form.short_description }}
          </div>

          <div class="mb-3">
            <label class="form-label">Full Description</label>

            {{ form.full_description }}
          </div>

          <div class="mb-3">
            <label class="form-label">Category</label>

            {{ form.category }}
          </div>
          <div class="mb-3">
            <label class="form-label">Price</label>

            {{ form.price }}
          </div>

          <div class="mb-3">
            <label class="form-label">Instructor</label>

            {{ form.instructor }}
          </div>

          <div class="mb-3">
            <label name="status" id="status" class="form-label">Status</label>

            {{ form.status }}
          </div>

              </fieldset>
        </form>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const input = document.getElementById('id_thumbnail')
      const preview = document.getElementById('thumbnailPreview')
    
      if (input && preview) {
        input.addEventListener('change', function () {
          const file = this.files[0]
    
          if (file) {
            preview.src = URL.createObjectURL(file)
            preview.style.display = 'block'
          }
        })
      }
    })
  </script>
{% endblock %}
