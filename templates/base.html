<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EduHub LMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fb;
}

/* Navbar */

.navbar{
    height:70px;
    background:white;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#4f46e5;
}

.logo i{
    margin-right:8px;
}

.search-box{
    width:420px;
}

.search-box input{
    border-radius:50px;
    border:none;
    background:#eef2ff;
    padding:12px 20px;
}

.search-box input:focus{
    box-shadow:none;
}

/* Sidebar */

.sidebar{

    position:fixed;
    left:0;
    top:70px;
    width:260px;
    height:100%;
    background:#1e293b;
    overflow:auto;

}

.sidebar h6{

    color:#94a3b8;
    margin:25px;

}

.sidebar a{

    display:block;
    color:#cbd5e1;
    text-decoration:none;
    padding:14px 25px;
    transition:.3s;

}

.sidebar a:hover{

    background:#334155;
    color:white;
    padding-left:35px;

}

.sidebar i{

    margin-right:12px;

}

/* Main */

.main{

    margin-left:260px;
    margin-top:70px;
    padding:35px;

}

/* Cards */

.card{

    border:none;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.stat-card{

    transition:.3s;

}

.stat-card:hover{

    transform:translateY(-8px);

}

.icon-box{

    width:60px;
    height:60px;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:26px;

}

.bg1{

    background:#4f46e5;

}

.bg2{

    background:#22c55e;

}

.bg3{

    background:#06b6d4;

}

.bg4{

    background:#f59e0b;

}

/* Table */

.table{

    vertical-align:middle;

}

/* User */

.user-img{

    width:42px;
    height:42px;
    border-radius:50%;

}

/* Footer */

footer{

    margin-top:50px;
    text-align:center;
    color:gray;

}

/* Responsive */

@media(max-width:991px){

.sidebar{

display:none;

}

.main{

margin-left:0;

}

.search-box{

display:none;

}

}

</style>

</head>

<body>

<!-- NAVBAR -->

{% include 'components/navbar.html' %}

<!-- SIDEBAR -->
{% include 'components/sidebar.html' %}


<!-- MAIN -->

{% block body %}

{% endblock body %}

<!-- message -->
{% include 'components/message.html' %}
{% include 'components/footer.html' %}
{% comment %} footer  {% endcomment %}



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
