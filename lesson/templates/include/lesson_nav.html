<form method="GET" action="{% url 'lesson_search' %}" id="filterForm">

    <div class="row g-2 align-items-center mb-3">

        <!-- Search -->
        <div class="col-md-4">
            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search Lesson..."
                value="{{ query }}">
        </div>

        <!-- Course Filter --> 
        <div class="col-md-3">
            <select
                name="course"
                id="course"
                class="form-select">

                <option value="">All Course</option>

                {% for cat in courses %}
                    <option value="{{ cat.id }}"
                        {% if course == cat.id|stringformat:"s" %}selected{% endif %}>
                        {{ cat.title }}
                    </option>

                     {% empty %}

                    <option disabled>No courses available</option>

                {% endfor %}

            </select>
        </div>
        

        {% if user.role != 'student' %}

        <!-- Status -->
        <div class="col-md-2">
            <select
                name="status"
                id="status"
                class="form-select">

                <option value="">All Status</option>

                <option value="published"
                    {% if status == "published" %}selected{% endif %}>
                    Published
                </option>

                <option value="draft"
                    {% if status == "draft" %}selected{% endif %}>
                    Draft
                </option>

            </select>
        </div>
        
        <!-- Add Course -->
        <div class="col-md-3 text-end">
            <a href="{% url 'lesson_create' %}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i>
                Add Lesson
            </a>
        </div>

   
{% endif %}
 </div>

</form>

<script>
document.getElementById("course").addEventListener("change", function () {
    document.getElementById("filterForm").submit();
});

const status = document.getElementById("status");

if (status) {
    status.addEventListener("change", function () {
        document.getElementById("filterForm").submit();
    });
}

</script>
