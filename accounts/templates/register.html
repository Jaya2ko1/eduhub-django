<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>EduHub | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{

            background:linear-gradient(135deg,#eef2ff,#f8fbff);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .register-card{

            width:100%;
            max-width:480px;
            border:none;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(0,0,0,.12);

        }

        .card-header{

            background:linear-gradient(135deg,#4f46e5,#6366f1);
            color:white;
            text-align:center;
            padding:40px 20px;

        }

        .card-header i{

            font-size:60px;

        }

        .card-header h2{

            margin-top:15px;
            font-weight:700;

        }

        .card-body{

            padding:40px;

        }

        .form-control{

            height:52px;
            border-radius:12px;
            border:1px solid #dbe4ff;

        }

        .form-control:focus{

            box-shadow:none;
            border-color:#4f46e5;

        }

        .input-group-text{

            background:white;
            border-radius:12px 0 0 12px;
            border:1px solid #dbe4ff;
            color:#4f46e5;

        }

        .btn-register{

            background:#4f46e5;
            color:white;
            border-radius:12px;
            height:52px;
            font-weight:600;

        }

        .btn-register:hover{

            background:#3730a3;
            color:white;

        }

        a{

            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="card register-card">

    <div class="card-header">

        <i class="bi bi-mortarboard-fill"></i>

        <h2>EduHub</h2>

        <p class="mb-0">
            Create your account and start learning today
        </p>

    </div>

    <div class="card-body">
        {% if form.errors %}
        <div class="alert alert-danger">
            {{ form.errors }}
        </div>
        {% endif %}
        <form method="post" action="">
            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person-badge"></i>

                    </span>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Choose a username" name="username">

                </div>

            </div>
            

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope"></i>

                    </span>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="Enter your email" name="email">

                </div>

            </div>

    

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Enter password" name="password1">

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Confirm Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-shield-lock"></i>

                    </span>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Confirm password" name="password2">

                </div>

            </div>

            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms" required>

                <label class="form-check-label" for="terms">

                    I agree to the
                    <a href="#">Terms & Conditions</a>

                </label>

            </div>

            <button class="btn btn-register w-100" type="submit">

                <i class="bi bi-person-plus-fill"></i>

                Create Account

            </button>

        </form>

        <hr class="my-4">

        <div class="text-center">

            Already have an account?

            <a href={% url 'login'%} class="fw-bold">

                Login

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
